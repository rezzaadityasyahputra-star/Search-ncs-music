<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rezToolsAi - Direct NCS Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            color: white;
            overflow-x: hidden;
            padding-bottom: 100px; /* Ruang untuk player di bawah */
        }

        /* --- Navbar --- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            animation: fadeInDown 0.8s ease-out;
            position: sticky;
            top: 0;
            background: rgba(15, 12, 41, 0.8);
            backdrop-filter: blur(10px);
            z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .brand-name {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(to right, #fff, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        /* --- Music Section --- */
        .container {
            flex: 1;
            padding: 30px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .music-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .music-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .music-card:hover {
            transform: scale(1.05);
            background: rgba(108, 92, 231, 0.2);
            border-color: #6c5ce7;
        }

        .music-card img {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 15px;
            object-fit: cover;
            margin-bottom: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .music-card h3 {
            font-size: 0.85rem;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .music-card p {
            font-size: 0.7rem;
            color: #a29bfe;
        }

        /* --- Global Audio Player (Sticky Bottom) --- */
        .audio-player {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(30, 30, 46, 0.95);
            backdrop-filter: blur(15px);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 2px solid #6c5ce7;
            z-index: 1000;
            transform: translateY(100%);
            transition: 0.5s ease-in-out;
        }

        .audio-player.active {
            transform: translateY(0);
        }

        .current-info {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 30%;
        }

        .current-info img {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            animation: rotate 5s linear infinite;
            animation-play-state: paused;
        }

        .playing img { animation-play-state: running; }

        .info-text h4 { font-size: 0.9rem; margin: 0; }
        .info-text p { font-size: 0.75rem; color: #a29bfe; margin: 0; }

        .controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .btn-ctrl {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-play {
            width: 50px;
            height: 50px;
            background: #6c5ce7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* Loading Animation */
        .loader {
            grid-column: 1/-1;
            text-align: center;
            padding: 50px;
        }

        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="https://rezatools-ai-website.vercel.app/" class="exit-link"><i class="fas fa-sign-out-alt"></i></a>
        <div class="brand-name">rezToolsAi</div>
        <div style="width: 40px;"></div>
    </nav>

    <main class="container">
        <div class="music-grid" id="music-grid">
            <div class="loader">
                <i class="fas fa-spinner fa-spin fa-2x"></i>
                <p>Menghubungkan ke NCS...</p>
            </div>
        </div>
    </main>

    <div class="audio-player" id="player-bar">
        <div class="current-info" id="player-info">
            <img src="" id="track-img" alt="cover">
            <div class="info-text">
                <h4 id="track-title">Judul Lagu</h4>
                <p id="track-artist">Artis</p>
            </div>
        </div>

        <div class="controls">
            <button class="btn-ctrl" onclick="togglePlay()"><i class="fas fa-play" id="play-icon"></i></button>
        </div>

        <div style="width: 30%; text-align: right;">
            <i class="fas fa-volume-up"></i>
        </div>
    </div>

    <audio id="main-audio"></audio>

    <script>
        const audio = document.getElementById('main-audio');
        const playIcon = document.getElementById('play-icon');
        const playerBar = document.getElementById('player-bar');

        async function loadNCS() {
            try {
                const response = await fetch('https://api.sxtream.my.id/audio/ncs-music');
                const data = await response.json();
                const grid = document.getElementById('music-grid');
                grid.innerHTML = '';

                data.result.forEach(track => {
                    const card = document.createElement('div');
                    card.className = 'music-card';
                    card.innerHTML = `
                        <img src="${track.image_url}" alt="NCS">
                        <h3>${track.title}</h3>
                        <p>${track.artists}</p>
                    `;
                    // Klik kartu langsung putar
                    card.onclick = () => playMusic(track.download_url, track.title, track.artists, track.image_url);
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error("Gagal load music");
            }
        }

        function playMusic(url, title, artist, img) {
            // Tampilkan Player Bar
            playerBar.classList.add('active');
            
            // Set Info
            document.getElementById('track-title').innerText = title;
            document.getElementById('track-artist').innerText = artist;
            document.getElementById('track-img').src = img;

            // Set Audio Source & Play
            audio.src = url;
            audio.play();
            
            playIcon.className = 'fas fa-pause';
            document.getElementById('player-info').classList.add('playing');
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                playIcon.className = 'fas fa-pause';
                document.getElementById('player-info').classList.add('playing');
            } else {
                audio.pause();
                playIcon.className = 'fas fa-play';
                document.getElementById('player-info').classList.remove('playing');
            }
        }

        // Jalankan saat start
        loadNCS();
    </script>
</body>
</html>
